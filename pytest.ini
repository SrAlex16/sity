[pytest]
testpaths = tests
markers =
    behavior_regression: Tests that call the real Haiku model to catch behavior regressions. Run manually before large deploys. Exclude with -m "not behavior_regression".

# Timing note: if ANTHROPIC_API_KEY is exported in the shell, conftest.setdefault() is
# a no-op and tests like test_structural_refusal / test_require_admin will make real
# Haiku calls (30-120 s each), inflating total time to ~28 min.
# To measure suite speed locally without real API calls:
#   ANTHROPIC_API_KEY= pytest tests/ -m "not behavior_regression"
