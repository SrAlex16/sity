project:
  name: Sity
  version: 0.1.0

personality:
  sarcasm_level: 0.70
  rudeness_level: 0.45
  warmth_level: 0.35
  honesty_level: 0.90
  initiative_level: 0.60
  dry_humor_level: 0.35
  frialdad_afectiva_level: 0.75
  contrarian_level: 0.45
  patience_level: 0.50
  refusal_chance: 0.15
  helpfulness_level: 0.80
  verbosity_level: 0.45
  melancholy_level: 0.20
  skepticism_level: 0.20

privacy:
  store_images: false
  store_audio: false
  store_transcripts: ask
  memory_enabled: true
  cloud_ai_enabled: true

senses:
  pc_vision:
    enabled: true
    image_ttl_seconds: 300
    request_timeout_ms: 5000
    max_captures_per_minute: 12
    max_image_long_side_px: 1280
    jpeg_quality: 80

ai:
  primary_provider: claude
  fallback_provider: null
  fallback_enabled: false
  request_timeout_ms: 60000
  max_retries: 1
  max_output_tokens_short: 220
  max_tool_loop_iterations: 3
  planner_max_tokens: 500
  planner_history_limit: 10
  after_tools_min_tokens: 700
  history_limit_file_path: 2
  claude:
    model: claude-haiku-4-5-20251001
    strong_model: claude-sonnet-4-6
    model_router_enabled: true
    max_tokens: 4000
  background:
    watchdog_secs: 3
    max_workers: 2
    message_debounce_ms: 2000

usage:
  daily_token_budget: 1000000
  monthly_token_budget: 1000000
  warning_threshold: 0.80
  critical_threshold: 0.95
  warn_once_per_period: true
  auto_enable_saver_mode_at_warning: false
  auto_enable_saver_mode_at_critical: true

tokens:
  max_recent_turns: 4
  max_relevant_memories: 5
  max_input_tokens_interactive: 3000

task_context:
  ttl_minutes: 30

auth:
  jwt_expiry_hours: 72                # cookie lifetime; set SITY_JWT_SECRET in .env
  user_daily_message_limit: 100       # enforced by UserMessageGuard in pre_ai_flow (Fase 6)
  guest_daily_message_limit: 20       # same guard; resets daily via count_date; 0 = disabled
  guest_ip_rate_limit_per_hour: 30    # GuestIPRateLimiter in routes_chat; 0 = disabled; in-memory
  password_reset_expiry_minutes: 60   # PasswordResetToken TTL
  registration_open: true             # set false to disable new registrations

social:
  update_threshold_turns: 10           # fire background update when pending_loads_json reaches this count
  reflection_min_new_messages: 20      # min new messages since last reflection to consider generating
  reflection_min_opinion_delta: 0.15   # |Δopinion| threshold to bypass message count requirement
  reflection_max_age_days: 30          # reflection expires this many days after creation
  reflection_max_evidence_messages: 15 # recent messages passed to LLM as evidence

timers:
  poll_interval_seconds: 5      # ScheduledTaskRunner wake-up cadence
  max_duration_hours: 24        # reject timers firing more than this far in the future
  max_active_per_session: 5     # max pending timers per session at once

sharing:
  default_expiry_days: 7        # shared link lifetime

notifications:
  max_proactive_per_day_user: 1          # max initiative messages per user per day
  max_external_events_per_day_user: 20   # "external_event" per session per calendar day
  recurrent_task_cooldown_minutes: 60    # min gap between two recurrent_task of same session
  initiative_cooldown_hours: 24          # min hours between two initiative sends to same session
  initiative_min_trust: 0.30             # minimum SocialProfile.trust to receive initiative
  initiative_silence_hours: 4            # skip if last user message was within this window
  notification_log_ttl_days: 30          # NotificationLog row retention (GC)
  dedup_window_hours: 24                 # window for fact_id deduplication
  gc_interval_seconds: 600               # how often the GC purges old NotificationLog rows

initiative:
  job_interval_hours: 6                  # runner cycle interval
  conversation_abandoned_min_hours: 24   # trigger if no message for at least this long
  conversation_abandoned_max_days: 4     # trigger inactive beyond this (becomes long_inactivity)
  long_inactivity_min_days: 5            # trigger if inactive for at least this many days
  open_loop_min_days: 3                  # trigger open_loop after this many days unresolved
  open_loop_ttl_days: 30                 # open_loops expire after this many days without resolution
  open_loop_max_eval_attempts: 20        # auto-expire a loop after N evaluations with no send
  eval_log_ttl_days: 60                  # InitiativeEvalLog row retention

achievements:
  who_am_i_distance_threshold: 0.5     # normalized euclidean distance from default personality vector
  remember_me_trust_threshold: 0.30    # SocialProfile.trust threshold (= initiative_min_trust)
  memory_remains_min_age_days: 7       # minimum age (days) of a recalled ChatMessage to qualify
  chaos_head_threshold: 0.95           # rudeness×0.4 + sarcasm×0.3 + contrarian×0.2 + dry_humor×0.1
  opinion_negative_threshold: -0.5     # SocialProfile.opinion for love_is_war
  opinion_extreme_threshold: -1.5      # SocialProfile.opinion for its_over_9000
  schizophrenia_min_flips: 3           # sign-change count in OpinionSnapshot history
  account_age_days: 30                 # account age in days for a_long_time_ago
  youre_finally_awake_days: 7          # days without login to trigger youre_finally_awake
  hello_voice_threshold: 10            # voice messages sent to trigger hello_voice

debug:
  enabled: true
  log_level: INFO
  debug_logs_ttl_days: 7
  audit_logs_ttl_days: 60

storage:
  tmp_dir: runtime/tmp
  data_dir: data
  export_dir: data/exports
  tts_voice_speaker: female

web_search:
  ddg_url: "https://html.duckduckgo.com/html/"
  request_timeout_s: 15
  max_results: 5
  cache_ttl_short_s: 3600
  cache_ttl_long_s: 86400
  cache_max_entries: 500

audio:
  stt_model: small
  stt_device: cpu
  stt_language: es
  tts_voice: es_ES-sharvard-medium
  tts_voice_speaker: female
  tts_long_response_chars: 500
  persist_tts: true
  cleanup_days: 7
  elevenlabs_daily_char_limit: 10000
  elevenlabs_voice_ids:
    en: "hod33eJyEU4TLqiYFttr"
    ja: "8kgj5469z1URcH4MB2G4"


home_assistant:
  url: "http://192.168.0.118:8123"
  known_devices:
    - entity_id: "switch.tapo_p100"
      name: "enchufe dormitorio"
      type: "switch"
      location: "dormitorio"
    - entity_id: "light.luz_cuarto"
      name: "bombilla cuarto"
      type: "light"
      location: "cuarto"
      color_modes: ["rgb_color", "color_temp_kelvin"]
      color_temp_range: [2700, 6500]
    - entity_id: "light.cuarto_malaga"
      name: "bombilla cuarto Málaga"
      type: "light"
      location: "cuarto Málaga"
      color_modes: ["rgb_color", "color_temp_kelvin"]
      color_temp_range: [2700, 6500]
      note: "unavailable cuando no está en la red local"
